<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meine Woche</title>

    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--page);
        color-scheme: light;
        --page: hsl(250 0% 98%);
        --card: hsl(250 10% 100%);
        --text: #1e293b;
        --muted: #64748b;
        --item: hsl(250 15% 94%);
        --accent: hsl(250 75% 48%);
        --border: hsl(250 20% 82%);
        --shadow: rgb(30 41 59 / 15%);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: 100px;
        background: var(--page);
        color: var(--text);
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      .deck {
        display: grid;
        justify-items: center;
        gap: 0;
        width: min(100%, 900px);
      }

      .slide {
        width: fit-content;
        min-width: min(100%, 320px);
        max-width: 100%;
        padding: 32px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 10px 30px var(--shadow);
        animation: fade 0.3s ease both;
        transition: background-color 0.25s ease, border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(7px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .day {
        display: inline-block;
        padding: 6px 18px;
        color: #fff;
        background: var(--accent);
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 4px;
        font-size: 2.2rem;
        overflow-wrap: anywhere;
      }

      .sub {
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 1rem;
      }

      ul {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: max-content;
        max-width: 100%;
        margin: 0 auto;
        list-style: none;
      }

      li {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 14px;
        max-width: 100%;
        padding: 12px 16px;
        color: var(--text);
        background: var(--item);
        border-radius: 14px;
        font-size: 1.15rem;
        text-align: left;
        overflow-wrap: anywhere;
        animation: reveal 0.24s ease both;
      }

      .icon {
        flex: 0 0 auto;
        font-size: 1.8rem;
      }

      .title-slide {
        padding: 24px 0;
      }

      .title-slide .icon {
        font-size: 5rem;
      }

      .image-gallery {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 100%;
        margin: 0 auto 18px;
      }

      .slide-img {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 260px;
        border-radius: 14px;
        object-fit: contain;
        animation: reveal 0.3s ease both;
      }

      .image-gallery.multiple {
        width: min(100%, 560px);
      }

      .image-gallery.multiple .slide-img {
        flex: 1 1 0;
        width: 0;
        max-width: 260px;
        height: 190px;
      }

      .img-fallback {
        padding: 18px;
        color: var(--muted);
        background: var(--item);
        border-radius: 14px;
        font-size: 1rem;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        padding: 10px 22px;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-size: 1.05rem;
        transition: transform 0.16s ease, filter 0.16s ease,
          background-color 0.2s ease;
      }

      button:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      button:active {
        transform: scale(0.97);
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .counter {
        color: var(--muted);
        font-weight: 600;
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 14px;
      }

      .dot {
        width: 12px;
        height: 12px;
        padding: 0;
        background: var(--border);
        border-radius: 50%;
        cursor: pointer;
      }

      .dot.active {
        background: var(--accent);
        transform: scale(1.2);
      }

      .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
      }

      .theme-control {
        position: fixed;
        z-index: 5;
        bottom: 18px;
        left: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 5px 18px var(--shadow);
        transition: background-color 0.25s ease, border-color 0.25s ease;
      }

      .theme-control span {
        font-size: 1rem;
        line-height: 1;
      }

      .theme-control input {
        width: 130px;
        height: 8px;
        margin: 0;
        border-radius: 999px;
        appearance: none;
        cursor: pointer;
        background: linear-gradient(
          90deg,
          #fff 0%,
          #ffe66d 20%,
          #51d6c5 40%,
          #7866ff 60%,
          #e34baf 80%,
          #111 100%
        );
      }

      .theme-control input::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
        appearance: none;
        background: var(--card);
        border: 2px solid var(--accent);
        border-radius: 50%;
        box-shadow: 0 1px 5px rgb(0 0 0 / 20%);
      }

      .theme-control input::-moz-range-thumb {
        width: 15px;
        height: 15px;
        background: var(--card);
        border: 2px solid var(--accent);
        border-radius: 50%;
        box-shadow: 0 1px 5px rgb(0 0 0 / 20%);
      }

      @media (max-width: 520px) {
        body {
          padding: 16px;
          padding-bottom: 96px;
        }

        .slide {
          padding: 26px 18px;
        }

        h1 {
          font-size: 1.8rem;
        }

        li {
          gap: 10px;
          padding: 10px 12px;
          font-size: 1rem;
        }

        .image-gallery.multiple .slide-img {
          height: 140px;
        }

        .controls {
          gap: 8px;
        }

        .controls button {
          padding: 9px 14px;
          font-size: 0.95rem;
        }

        .theme-control {
          bottom: 12px;
          left: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="deck">
      <section class="slide" id="slide" aria-live="polite"></section>

      <nav class="controls" aria-label="Präsentationssteuerung">
        <button id="prev" type="button">← Zurück</button>
        <span class="counter" id="counter"></span>
        <button id="next" type="button">Weiter →</button>
      </nav>

      <div class="dots" id="dots" aria-label="Folien auswählen"></div>
      <p class="hint">← / → / S</p>
    </main>

    <label class="theme-control" aria-label="Farbschema einstellen">
      <span aria-hidden="true">☀️</span>
      <input
        id="themeSlider"
        type="range"
        min="0"
        max="100"
        value="0"
        aria-label="Farbschema von hell nach dunkel"
        aria-valuetext="Hell"
      />
      <span aria-hidden="true">🌙</span>
    </label>

    <script>
      const slides = [
        {
          day: "Präsentation",
          title: "Meine Woche",
          sub: "Hallo! Das bin ich.",
          titleSlide: true,
          icon: "🙋",
        },
        {
          day: "Montag",
          title: "Am Montag",
          sub: "In der Schule",
          imgs: ["Data/drapeau.jpg"],
          items: [
            ["🤾", "Ich stehe um halb sieben Uhr morgens."],
            ["🎒", "Ich gehe zur Schule."],
            ["📚", "Ich habe zwei Stunden Deutsch."],
          ],
        },
        {
          day: "Dienstag",
          title: "Am Dienstag",
          sub: "In der Schule 🏫",
          imgs: ["Data/Handball.png"],
          items: [
            ["⚽", "Ich spiele Handball."],
            ["🎤𝄞♪", "Um 13 Uhr singe ich. (Ich singe nicht gern)"],
          ],
        },
        {
          day: "Mittwoch",
          title: "Am Mittwoch",
          sub: "Morgens in der Schule 🏫",
          imgs: ["Data/volleyball.png", "Data/badminton.png"],
          items: [
            ["🚴", "Ich fahre Fahrrad."],
            ["✏️", "Ich schreibe eine Klassenarbeit."],
            ["🤾🏐🏸", "Ich spiele Handball, Volleyball und Badminton beim AS."],
          ],
        },
        {
          day: "Donnerstag",
          title: "Am Donnerstag",
          sub: "In der Schule 🏫",
          imgs: ["Data/denken.png"],
          items: [
            ["🤔", "Ich denken."],
            ["π", "Um 12 Uhr machen Thomas und ich Mathe."],
          ],
        },
        {
          day: "Freitag",
          title: "Am Freitag",
          sub: "In der Schule 🏫",
          imgs: ["Data/reparieren.jpg"],
          items: [
            ["🛠️", "Ich repariere Sachen."],
            ["📖", "Ich lese."],
            ["🍕", "Morgen: Schule, nachmittags: Freizeit."],
          ],
        },
        {
          day: "Samstag",
          title: "Am Samstag",
          sub: "Wochenende 🎉",
          imgs: ["Data/c.jpg"],
          items: [
            ["🛒", "Ich kaufe mit meiner Mutter ein."],
            ["👩🏻‍💻", "Ich schreibe Code."],
            ["🖥️", "Ich sehe fern."],
          ],
        },
        {
          day: "Sonntag",
          title: "Am Sonntag",
          sub: "Sport und Freizeit 🏂",
          imgs: ["Data/montblanc.jpg"],
          items: [
            ["🛌", "Ich bleibe zu Hause."],
            //["👩🏻‍💻", "Ich schreibe Code."],
            ["⛷️", "Im Winter fahre ich Ski."],
          ],
        },
        {
          day: "Ende",
          title: "Danke! 🙏",
          sub: "Bis bald! 👋",
          titleSlide: true,
          icon: "🌟",
        },
      ];

      let currentSlide = 0;
      let visibleItems = 0;

      const slideElement = document.getElementById("slide");
      const counterElement = document.getElementById("counter");
      const dotsElement = document.getElementById("dots");
      const themeSlider = document.getElementById("themeSlider");

      function createDots() {
        slides.forEach((slide, index) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "dot";
          dot.setAttribute("aria-label", `Folie ${index + 1}`);
          dot.addEventListener("click", () => showSlide(index));
          dotsElement.appendChild(dot);
        });
      }

      function showSlide(index) {
        currentSlide = (index + slides.length) % slides.length;
        visibleItems = 0;

        const slide = slides[currentSlide];

        if (slide.titleSlide) {
          slideElement.innerHTML = `
            <div class="title-slide">
              <div class="icon" aria-hidden="true">${slide.icon}</div>
              <h1>${slide.title}</h1>
              <p class="sub">${slide.sub}</p>
            </div>
          `;
        } else {
          const imageList = slide.imgs || [];
          const imagesHtml = imageList.length
            ? `
              <div class="image-gallery ${imageList.length > 1 ? "multiple" : ""}">
                ${imageList
                  .map(
                    (src, index) =>
                      `<img class="slide-img" src="${src}" alt="Bild ${index + 1} für ${slide.day}">`
                  )
                  .join("")}
              </div>
            `
            : "";

          slideElement.innerHTML = `
            <span class="day">${slide.day}</span>
            <h1>${slide.title}</h1>
            <p class="sub">${slide.sub}</p>
            ${imagesHtml}
            <ul class="items"></ul>
          `;

          slideElement.querySelectorAll(".slide-img").forEach((image) => {
            image.addEventListener("error", () => {
              const fallback = document.createElement("div");
              fallback.className = "img-fallback";
              fallback.textContent = "🚫 Bild nicht gefunden";
              image.replaceWith(fallback);
            });
          });

          renderItems();
        }

        counterElement.textContent = `${currentSlide + 1} / ${slides.length}`;

        document.querySelectorAll(".dot").forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === currentSlide);
          dot.setAttribute(
            "aria-current",
            dotIndex === currentSlide ? "true" : "false"
          );
        });
      }

      function renderItems() {
        const list = slideElement.querySelector(".items");
        if (!list) return;

        const slide = slides[currentSlide];
        const items = (slide.items || []).slice(0, visibleItems);

        list.innerHTML = items
          .map(
            ([icon, text]) =>
              `<li><span class="icon" aria-hidden="true">${icon}</span><span>${text}</span></li>`
          )
          .join("");

        list.hidden = items.length === 0;
      }

      function revealNextItem() {
        const slide = slides[currentSlide];
        if (slide.titleSlide) return;

        const totalItems = (slide.items || []).length;
        if (visibleItems < totalItems) {
          visibleItems += 1;
          renderItems();
        }
      }

      function applyTheme(value) {
        const t = Number(value) / 100;
        const hue = (250 + t * 360) % 360;
        const saturation = Math.sin(Math.PI * t) * 78;
        const pageLightness = 98 - t * 82;
        const cardLightness = Math.min(100, pageLightness + (t < 0.5 ? 3 : -4));
        const isDark = t > 0.58;

        document.documentElement.style.setProperty(
          "--page",
          `hsl(${hue} ${saturation}% ${pageLightness}%)`
        );
        document.documentElement.style.setProperty(
          "--card",
          `hsl(${(hue + 12) % 360} ${Math.max(12, saturation * 0.58)}% ${cardLightness}%)`
        );
        document.documentElement.style.setProperty(
          "--item",
          `hsl(${(hue + 28) % 360} ${Math.max(14, saturation * 0.5)}% ${isDark ? 27 : 94 - t * 35}%)`
        );
        document.documentElement.style.setProperty(
          "--accent",
          `hsl(${(hue + 35) % 360} 76% ${isDark ? 62 : 46}%)`
        );
        document.documentElement.style.setProperty(
          "--border",
          `hsl(${(hue + 15) % 360} ${Math.max(16, saturation * 0.38)}% ${isDark ? 38 : 82}%)`
        );
        document.documentElement.style.setProperty(
          "--text",
          isDark ? "#f8fafc" : "#172033"
        );
        document.documentElement.style.setProperty(
          "--muted",
          isDark ? "#e2e8f0" : "#536176"
        );
        document.documentElement.style.setProperty(
          "--shadow",
          isDark ? "rgb(0 0 0 / 28%)" : "rgb(30 41 59 / 15%)"
        );

        themeSlider.setAttribute(
          "aria-valuetext",
          value == 0 ? "Hell" : value == 100 ? "Dunkel" : `Farbton ${value}%`
        );
      }

      document.getElementById("prev").addEventListener("click", () => {
        showSlide(currentSlide - 1);
      });

      document.getElementById("next").addEventListener("click", () => {
        showSlide(currentSlide + 1);
      });

      themeSlider.addEventListener("input", (event) => {
        applyTheme(event.target.value);
      });

      document.addEventListener(
        "keydown",
        (event) => {
          if (event.repeat) return;

          if (event.code === "ArrowRight") {
            event.preventDefault();
            showSlide(currentSlide + 1);
          } else if (event.code === "ArrowLeft") {
            event.preventDefault();
            showSlide(currentSlide - 1);
          } else if (
            event.code === "Space" ||
            event.key === " " ||
            event.key.toLowerCase() === "s"
          ) {
            event.preventDefault();
            revealNextItem();
          }
        },
        true
      );


      createDots();
      applyTheme(0);
      showSlide(0);
    </script>
  </body>
</html>
